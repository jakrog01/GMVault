name: release

# Every push to master (a merged dev -> master PR) releases the version in
# _system/VERSION; the release creates the vX.Y.Z tag on that commit.
on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  package:
    if: github.event.repository.is_template
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          version=$(tr -d '[:space:]' < _system/VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::warning::v$version is already tagged; nothing to release"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        run: npm test
      - if: steps.version.outputs.new == 'true'
        run: node _system/bin/package-release.mjs GMVault.zip
      - if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: GMVault ${{ steps.version.outputs.version }}
          files: GMVault.zip

  publish-docs:
    needs: package
    if: github.event.repository.is_template && needs.package.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install -r .github/docs-requirements.txt
      - run: mkdocs build --strict -f .github/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/site
      - id: deployment
        uses: actions/deploy-pages@v4
