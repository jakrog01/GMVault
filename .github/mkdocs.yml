site_name: GMVault manual
site_description: The practical manual for an upgradeable tabletop RPG vault
site_url: https://jakrog01.github.io/GMVault/
docs_dir: ../docs
site_dir: ../.github/site
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - toc.follow
    - content.code.copy
  palette:
    - scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
plugins:
  - search
nav:
  - GMVault manual: README.md
  - Start here:
      - Start here: start-here/index.md
      - Install: GETTING-STARTED.md
      - Your first campaign: FIRST-CAMPAIGN.md
      - Where things go: WHERE-THINGS-GO.md
      - GMVault concepts: CONCEPTS.md
  - At the table:
      - At the table: at-the-table/index.md
      - Home: HOME.md
      - Sessions and runs: RUNS.md
      - Combat tracker and dice: TABLE-TOOLS.md
      - Assistant: ASSISTANT.md
  - Make it yours:
      - Make it yours: make-it-yours/index.md
      - Table Tools settings: SETTINGS.md
      - Templates and overrides: CUSTOMISING.md
      - Game systems: AUTHORING-SYSTEMS.md
  - Maintenance:
      - Maintenance: maintenance/index.md
      - Keeping a vault up to date: UPDATING.md
      - Adopting an existing vault: ADOPTING.md
      - CLI reference: CLI.md
      - Troubleshooting: TROUBLESHOOTING.md
  - For developers:
      - For developers: for-developers/index.md
      - Architecture: ARCHITECTURE.md
      - Maintaining releases: UPGRADING.md
      - "ADR 0001: release zip plus migrations": adr/0001-update-mechanism.md
      - "ADR 0002: active run pointer location": adr/0002-active-pointer-location.md
      - "ADR 0003: assistant retrieval": adr/0003-assistant-retrieval.md
      - "ADR 0004: note contract": adr/0004-note-contract.md
